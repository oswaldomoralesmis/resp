# Configuración de nginx para el RESP — servidor de pruebas (acceso por IP,
# sin dominio ni HTTPS). Colocar en /etc/nginx/conf.d/resp_project.conf
server {
    listen 9000;
    server_name _;

    client_max_body_size 25M;

    access_log /var/log/nginx/resp_project.access.log;
    error_log  /var/log/nginx/resp_project.error.log;

    location /static/ {
        alias /opt/resp_project/staticfiles/;
    }

    location /media/ {
        alias /opt/resp_project/media/;
    }

    location / {
        proxy_pass http://127.0.0.1:9001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
