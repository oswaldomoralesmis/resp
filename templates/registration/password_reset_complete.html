{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contraseña actualizada — RESP Tabasco</title>
  <link rel="stylesheet" href="{% static 'css/resp.css' %}">
</head>
<body>
<div class="login-page">
  <div class="login-box">
    <div class="login-logo">
      <img src="{% static 'img/logo_resp.png' %}" alt="RESP — Registro Estatal de Servidores Públicos, Gobierno del Estado de Tabasco" class="login-logo-img">
    </div>
    <div class="alert-resp alert-success">
      ✅ Su contraseña fue actualizada correctamente.
    </div>
    <a href="{% url 'login' %}" class="btn-institucional w-100" style="justify-content:center;padding:12px;">
      🔐 Iniciar sesión
    </a>
  </div>
</div>
</body>
</html>
