{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar contraseña — RESP Tabasco</title>
  <link rel="stylesheet" href="{% static 'css/resp.css' %}">
</head>
<body>
<div class="login-page">
  <div class="login-box">
    <div class="login-logo">
      <img src="{% static 'img/logo_resp.png' %}" alt="RESP — Registro Estatal de Servidores Públicos, Gobierno del Estado de Tabasco" class="login-logo-img">
    </div>
    <p style="font-size:14px;color:#555;margin-bottom:16px;">
      Escriba su correo institucional y le enviaremos un enlace para restablecer su contraseña.
    </p>
    <form method="post" novalidate>
      {% csrf_token %}
      <div style="margin-bottom:24px;">
        <label class="form-label">Correo institucional</label>
        <input type="email" name="email" class="form-control" placeholder="usuario@tabasco.gob.mx" autofocus required>
        {% if form.email.errors %}<div class="text-danger small mt-1">{{ form.email.errors|join:", " }}</div>{% endif %}
      </div>
      <button type="submit" class="btn-institucional w-100" style="justify-content:center;padding:12px;">
        ✉️ Enviar enlace de recuperación
      </button>
    </form>
    <div style="margin-top:16px;text-align:center;font-size:13px;">
      <a href="{% url 'login' %}">← Volver a iniciar sesión</a>
    </div>
  </div>
</div>
</body>
</html>
