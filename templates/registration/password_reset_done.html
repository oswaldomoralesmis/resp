{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar contraseña — RESP Tabasco</title>
  <link rel="stylesheet" href="{% static 'css/resp.css' %}">
</head>
<body>
<div class="login-page">
  <div class="login-box">
    <div class="login-logo">
      <img src="{% static 'img/logo_resp.png' %}" alt="RESP — Registro Estatal de Servidores Públicos, Gobierno del Estado de Tabasco" class="login-logo-img">
    </div>
    <div class="alert-resp alert-success">
      ✅ Si el correo que escribió pertenece a una cuenta activa, le enviamos un enlace para
      restablecer su contraseña. Revise su bandeja de entrada (y la carpeta de spam).
    </div>
    <div style="margin-top:16px;text-align:center;font-size:13px;">
      <a href="{% url 'login' %}">← Volver a iniciar sesión</a>
    </div>
  </div>
</div>
</body>
</html>
